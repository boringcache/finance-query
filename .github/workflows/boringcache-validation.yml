name: BoringCache validation — finance-query Docker jobs
run-name: Finance-query issue 494 — ${{ inputs.providers }} — ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact upstream commit to build
        required: true
        type: string
      providers:
        description: Cache providers to compare
        type: choice
        options:
          - all
          - boringcache
          - github
        default: all

permissions:
  contents: read

concurrency:
  group: finance-query-cache-validation-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  github:
    name: GitHub cache — ${{ matrix.job_name }}
    if: github.repository == 'boringcache/finance-query' && github.ref == 'refs/heads/boringcache-validation' && (inputs.providers == 'all' || inputs.providers == 'github')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: server
            job_name: Docker Build
            dockerfile: server/Dockerfile
            image: financequery:v2-ci
            scope: docker-server-boringcache-validation-v2
            sarif_category: trivy-server-github
          - target: mcp
            job_name: MCP Docker Build
            dockerfile: finance-query-mcp/Dockerfile
            image: financequery:mcp-ci
            scope: docker-mcp-boringcache-validation-v2
            sarif_category: trivy-mcp-github
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout the upstream source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Verdenroz/finance-query
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Record the source revision
        env:
          EXPECTED_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          [[ "$EXPECTED_SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_REF"
          git rev-parse HEAD

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: CARGO_FEATURES=translation
          push: false
          load: true
          tags: ${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

      - name: Test Docker image
        if: matrix.target == 'server'
        run: |
          docker run -d --name test-container -p 8000:8000 financequery:v2-ci
          sleep 5
          docker exec test-container curl -f http://localhost:8000/v2/health || true
          docker stop test-container
          docker rm test-container

      - name: Test MCP Docker image
        if: matrix.target == 'mcp'
        run: |
          docker run -d --name test-mcp -p 3000:3000 -e MCP_TRANSPORT=http financequery:mcp-ci
          sleep 10
          curl -f http://localhost:3000/health
          docker stop test-mcp
          docker rm test-mcp

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln

      - name: Upload Trivy results to code scanning
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: ${{ matrix.sarif_category }}

  boringcache:
    name: BoringCache — ${{ matrix.job_name }}
    if: github.repository == 'boringcache/finance-query' && github.ref == 'refs/heads/boringcache-validation' && (inputs.providers == 'all' || inputs.providers == 'boringcache')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: server
            job_name: Docker Build
            image: financequery:v2-ci
            sarif_category: trivy-server-boringcache
          - target: mcp
            job_name: MCP Docker Build
            image: financequery:mcp-ci
            sarif_category: trivy-mcp-boringcache
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout the validation plan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: boringcache-validation
          path: .boringcache-plan
          persist-credentials: false

      - name: Checkout the upstream source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Verdenroz/finance-query
          ref: ${{ inputs.source_ref }}
          path: source
          persist-credentials: false

      - name: Record the source revision
        working-directory: source
        env:
          EXPECTED_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          [[ "$EXPECTED_SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_REF"
          git rev-parse HEAD

      - name: Build Docker image
        id: boringcache
        uses: boringcache/one@1039999c65011be670f5655e0e48ad556188ab12 # v1.30.4
        with:
          working-directory: .boringcache-plan/.github/boringcache-plans/${{ matrix.target }}
          trust-policy: publish
          mode: docker
          diagnostics: summary
          fail-on-cache-error: true

      - name: Test Docker image
        if: matrix.target == 'server'
        run: |
          docker run -d --name test-container -p 8000:8000 financequery:v2-ci
          sleep 5
          docker exec test-container curl -f http://localhost:8000/v2/health || true
          docker stop test-container
          docker rm test-container

      - name: Test MCP Docker image
        if: matrix.target == 'mcp'
        run: |
          docker run -d --name test-mcp -p 3000:3000 -e MCP_TRANSPORT=http financequery:mcp-ci
          sleep 10
          curl -f http://localhost:3000/health
          docker stop test-mcp
          docker rm test-mcp

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln

      - name: Upload Trivy results to code scanning
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: ${{ matrix.sarif_category }}

      - name: Retain BoringCache evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finance-query-boringcache-${{ matrix.target }}-${{ inputs.source_ref }}
          path: ${{ steps.boringcache.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 30
